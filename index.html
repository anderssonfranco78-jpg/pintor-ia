<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Estudio de Pintura Digital Progresiva — Pinturas de Carbono</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      max-width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #140f0c;
      color: #f7ede4;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Barra de Controles Superior Compacta (No sale en el video grabado, perfecta en celular y PC) */
    #control-bar {
      width: 100%;
      padding: 8px 12px;
      background: rgba(22, 15, 11, 0.96);
      border-bottom: 1px solid rgba(216, 158, 130, 0.25);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      z-index: 30;
      flex-shrink: 0;
      transition: all 0.25s ease;
    }

    /* Cuando se está grabando, desaparecen todos los botones salvo detener grabación */
    body.is-recording .hide-on-record,
    body.is-recording #style-modal-backdrop {
      display: none !important;
    }
    body.is-recording #control-bar {
      padding: 5px 10px;
      background: rgba(18, 12, 9, 0.85);
    }

    .ctrl-btn {
      background: linear-gradient(180deg, #382920, #261c16);
      color: #f8ede3;
      border: 1px solid rgba(218, 162, 134, 0.42);
      border-radius: 10px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
    }
    .ctrl-btn:hover {
      border-color: #f0b89a;
      background: linear-gradient(180deg, #48352a, #31241c);
    }
    .ctrl-btn:active {
      transform: scale(0.96);
    }
    .ctrl-btn.style-open-btn {
      background: linear-gradient(180deg, #e5a889, #c48060);
      color: #1c110b;
      border-color: #ffe2d1;
      font-weight: 800;
      box-shadow: 0 3px 12px rgba(216, 155, 126, 0.4);
    }
    .ctrl-btn.upload-btn {
      background: linear-gradient(180deg, #4a3529, #33241b);
      color: #ffe7d6;
      border-color: #e0a384;
      font-weight: 800;
    }
    .ctrl-btn.record-btn {
      background: linear-gradient(180deg, #d6382d, #9e1f17);
      color: #ffffff;
      border-color: #ff9e96;
    }
    .ctrl-btn.record-btn.recording {
      animation: pulseRec 1s infinite alternate;
      background: linear-gradient(180deg, #ff3b30, #b81d13);
    }
    .ctrl-btn.share-btn {
      background: linear-gradient(180deg, #25d366, #169c46);
      color: #0f2918;
      border-color: #a4f7c2;
      font-weight: 800;
      display: none;
    }
    @keyframes pulseRec {
      0% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
      100% { box-shadow: 0 0 0 8px rgba(255, 59, 48, 0); }
    }

    select.ctrl-select {
      background: #261c16;
      color: #f8ede3;
      border: 1px solid rgba(218, 162, 134, 0.42);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }

    /* Ventana / Caja Desplegable de los 23 Estilos Artísticos */
    #style-modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(10, 7, 5, 0.84);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    #style-modal-backdrop.open {
      display: flex;
    }
    #style-modal-box {
      width: 100%;
      max-width: 920px;
      max-height: 90vh;
      max-height: 90dvh;
      background: #1e1510;
      border: 1px solid rgba(224, 163, 132, 0.45);
      border-radius: 16px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 12px 16px;
      background: #281c15;
      border-bottom: 1px solid rgba(218, 162, 134, 0.22);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: #fcece2;
    }
    .modal-close-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #f8ede3;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .modal-body {
      padding: 12px 14px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .cat-block {
      background: rgba(14, 9, 7, 0.55);
      border: 1px solid rgba(218, 162, 134, 0.18);
      border-radius: 13px;
      padding: 10px;
    }
    .cat-title {
      font-size: 12.5px;
      font-weight: 800;
      color: #e5a889;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin: 0 0 8px 0;
    }
    .style-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
      gap: 8px;
    }
    .style-card-btn {
      background: #2b1f18;
      color: #f2e4d8;
      border: 1px solid rgba(218, 162, 134, 0.26);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: all 0.15s ease;
      min-width: 0;
    }
    .style-card-btn:hover {
      background: #3b2a21;
      border-color: #f0b89a;
    }
    .style-card-btn.active {
      background: linear-gradient(180deg, #e0a384, #c58263);
      color: #1b110c;
      border-color: #fff;
      box-shadow: 0 3px 12px rgba(224, 163, 132, 0.45);
    }
    .style-card-btn .st-name {
      font-size: 12.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .style-card-btn .st-desc {
      font-size: 10.8px;
      opacity: 0.84;
      line-height: 1.25;
      font-weight: 500;
    }

    /* Contenedor del Estudio (Se ajusta automáticamente a cualquier pantalla de celular o PC sin desbordar) */
    #studio-stage {
      flex: 1 1 0%;
      min-width: 0;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      overflow: hidden;
      position: relative;
    }

    #studio-canvas {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 18px;
      display: block;
    }

    #toast-banner {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(34, 24, 18, 0.95);
      color: #ffe8d6;
      border: 1px solid rgba(216, 158, 130, 0.55);
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 120;
      text-align: center;
      max-width: 92vw;
    }

    @media (max-width: 768px) {
      #control-bar {
        padding: 6px 6px;
        gap: 5px;
      }
      .ctrl-btn {
        padding: 6px 9px;
        font-size: 11px;
        border-radius: 8px;
      }
      select.ctrl-select {
        padding: 5px 7px;
        font-size: 10.8px;
        border-radius: 8px;
      }
      #style-modal-backdrop {
        padding: 6px;
      }
      .modal-header {
        padding: 10px 12px;
      }
      .modal-header h2 {
        font-size: 13px;
      }
      .modal-body {
        padding: 8px 10px 14px;
        gap: 10px;
      }
      .style-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .style-card-btn {
        padding: 7px 8px;
      }
      .style-card-btn .st-name {
        font-size: 11.2px;
      }
      .style-card-btn .st-desc {
        font-size: 9.8px;
      }
      #studio-stage {
        padding: 3px;
      }
    }
  </style>
</head>
<body>

  <!-- Barra Superior Compacta (Oculta al grabar video) -->
  <div id="control-bar">
    <button id="btn-open-styles" class="ctrl-btn style-open-btn hide-on-record" title="Abrir catálogo desplegable con los 23 estilos de dibujo">
      🎨 Estilo: <span id="current-style-label">Claroscuro / Carboncillo</span> ▾
    </button>

    <input type="file" id="file-input" accept="image/*" style="display:none;" />
    <button id="btn-upload" class="ctrl-btn upload-btn hide-on-record" title="Subir cualquier foto de tu teléfono o computadora">
      📸 Subir Foto
    </button>
    <button id="btn-record" class="ctrl-btn record-btn" title="Reiniciar desde cero y grabar todo el video del proceso sin botones">
      🔴 Grabar Video
    </button>
    <button id="btn-share" class="ctrl-btn share-btn hide-on-record" title="Compartir el video grabado por WhatsApp o redes">
      📲 Enviar Video
    </button>
    <button id="btn-replay" class="ctrl-btn hide-on-record" title="Volver a pintar desde cero">
      🔄 Repetir
    </button>
    <button id="btn-save-img" class="ctrl-btn hide-on-record" title="Descargar cuadro pintado en alta definición">
      🖼️ Guardar HD
    </button>
    <select id="sel-layout" class="ctrl-select hide-on-record" title="Cambiar orientación del estudio">
      <option value="auto">📐 Auto</option>
      <option value="horizontal">🖥️ 16:9 PC</option>
      <option value="vertical">📱 9:16 Celular</option>
    </select>
    <select id="sel-duration" class="ctrl-select hide-on-record" title="Duración total del pintado">
      <option value="12">⏱️ 12s</option>
      <option value="20" selected>⏱️ 20s</option>
      <option value="30">⏱️ 30s</option>
    </select>
  </div>

  <!-- Ventana / Caja Desplegable con las 5 Categorías y todos los Estilos -->
  <div id="style-modal-backdrop">
    <div id="style-modal-box">
      <div class="modal-header">
        <h2>🎨 Selecciona el Estilo de Dibujo o Pintura (23 Estilos)</h2>
        <button id="btn-close-styles" class="modal-close-btn">✕ Cerrar</button>
      </div>
      <div id="style-categories-container" class="modal-body"></div>
    </div>
  </div>

  <!-- Escenario Principal donde se renderiza y graba todo el Estudio -->
  <div id="studio-stage">
    <canvas id="studio-canvas" width="1600" height="900"></canvas>
  </div>

  <div id="toast-banner"></div>

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function clampByte(v) {
  return Math.max(0, Math.min(255, Math.round(v)));
}

function rgbToHex(r, g, b) {
  const toH = (n) => clampByte(n).toString(16).padStart(2, '0');
  return '#' + toH(r) + toH(g) + toH(b);
}

  if (imgElement) currentLoadedImage = imgElement;
  if (!currentLoadedImage) return;

  const iw = currentLoadedImage.naturalWidth || currentLoadedImage.width;
  const ih = currentLoadedImage.naturalHeight || currentLoadedImage.height;
  const side = Math.min(iw, ih);
  const sx = (iw - side) * 0.5;
  const sy = (ih - side) * 0.35;

  refCtx.clearRect(0, 0, PAINT_RES, PAINT_RES);
  refCtx.drawImage(currentLoadedImage, sx, sy, side, side, 0, 0, PAINT_RES, PAINT_RES);

  const tmpSmall = document.createElement('canvas');
  tmpSmall.width = 48; tmpSmall.height = 48;
  tmpSmall.getContext('2d').drawImage(refCanvas, 0, 0, 48, 48);
  blurLargeCtx.imageSmoothingEnabled = true;
  blurLargeCtx.drawImage(tmpSmall, 0, 0, 48, 48, 0, 0, PAINT_RES, PAINT_RES);

  const tmpMed = document.createElement('canvas');
  tmpMed.width = 160; tmpMed.height = 160;
  tmpMed.getContext('2d').drawImage(refCanvas, 0, 0, 160, 160);
  blurMedCtx.imageSmoothingEnabled = true;
  blurMedCtx.drawImage(tmpMed, 0, 0, 160, 160, 0, 0, PAINT_RES, PAINT_RES);

  refPixels   = refCtx.getImageData(0, 0, PAINT_RES, PAINT_RES).data;
  medPixels   = blurMedCtx.getImageData(0, 0, PAINT_RES, PAINT_RES).data;
  largePixels = blurLargeCtx.getImageData(0, 0, PAINT_RES, PAINT_RES).data;

  // Compute raw luminance & adaptive auto-levels (5th to 95th percentile) so dark photos never turn black
  const lum = new Float32Array(PAINT_RES * PAINT_RES);
  const hist = new Uint32Array(256);
  for (let i = 0; i < PAINT_RES * PAINT_RES; i++) {
    const p = i * 4;
    const l = 0.299 * refPixels[p] + 0.587 * refPixels[p + 1] + 0.114 * refPixels[p + 2];
    lum[i] = l;
    hist[clampByte(l)]++;
  }

  const totalPx = PAINT_RES * PAINT_RES;
  let sum = 0, pLow = 10, pHigh = 245;
  for (let i = 0; i < 256; i++) {
    sum += hist[i];
    if (sum < totalPx * 0.04) pLow = i;
    if (sum < totalPx * 0.96) pHigh = i;
  }
  const span = Math.max(40, pHigh - pLow);
  for (let i = 0; i < totalPx; i++) {
    normLumMap[i] = Math.max(0, Math.min(255, ((lum[i] - pLow) / span) * 255));
  }

  let maxGrad = 1.0;
  for (let y = 1; y < PAINT_RES - 1; y++) {
    for (let x = 1; x < PAINT_RES - 1; x++) {
      const idx = y * PAINT_RES + x;
      const gx =
        -normLumMap[(y - 1) * PAINT_RES + (x - 1)] + normLumMap[(y - 1) * PAINT_RES + (x + 1)]
        - 2 * normLumMap[y * PAINT_RES + (x - 1)]   + 2 * normLumMap[y * PAINT_RES + (x + 1)]
        - normLumMap[(y + 1) * PAINT_RES + (x - 1)] + normLumMap[(y + 1) * PAINT_RES + (x + 1)];
      const gy =
        -normLumMap[(y - 1) * PAINT_RES + (x - 1)] - 2 * normLumMap[(y - 1) * PAINT_RES + x] - normLumMap[(y - 1) * PAINT_RES + (x + 1)]
        + normLumMap[(y + 1) * PAINT_RES + (x - 1)] + 2 * normLumMap[(y + 1) * PAINT_RES + x] + normLumMap[(y + 1) * PAINT_RES + (x + 1)];
      const mag = Math.hypot(gx, gy);
      edgeMagMap[idx] = mag;
      if (mag > maxGrad) maxGrad = mag;
      edgeAngleMap[idx] = Math.atan2(gy, gx) + Math.PI * 0.5;
    }
  }
  for (let i = 0; i < edgeMagMap.length; i++) {
    edgeMagMap[i] = Math.min(1.0, edgeMagMap[i] / (maxGrad * 0.58));
  }

  // Synthesize the exact target masterpiece for the selected style
  buildStyleTargetBuffer(currentStyle);

  // Plan 8 brush tiers (126px -> 3px)
  const rng = mulberry32(20261112);
  strokeQueue = [];

  for (let tIdx = 0; tIdx < BRUSH_TIERS.length; tIdx++) {
    const tier = BRUSH_TIERS[tIdx];
    const bSize = tier.size;
    const tierStrokes = [];

    let step = tIdx === 0 ? 52
             : tIdx === 1 ? 32
             : tIdx === 2 ? 19
             : tIdx === 3 ? 12
             : tIdx === 4 ? 8
             : tIdx === 5 ? 6
             : tIdx === 6 ? 4
             : 3;

    if (currentStyle === 'pixel') {
      step = tIdx === 0 ? 36 : tIdx === 1 ? 24 : tIdx === 2 ? 18 : tIdx === 3 ? 12 : 6;
    }

    for (let y = Math.floor(step * 0.5); y < PAINT_RES; y += step) {
      for (let x = Math.floor(step * 0.5); x < PAINT_RES; x += step) {
        const jitterAmt = currentStyle === 'pixel' ? 0.0 : 0.82;
        const jx = Math.max(0, Math.min(PAINT_RES - 1, Math.round(x + (rng() - 0.5) * step * jitterAmt)));
        const jy = Math.max(0, Math.min(PAINT_RES - 1, Math.round(y + (rng() - 0.5) * step * jitterAmt)));
        const flat = jy * PAINT_RES + jx;
        const edgeW = edgeMagMap[flat];

        const distCenter = Math.hypot((jx - PAINT_RES * 0.5) / (PAINT_RES * 0.5), (jy - PAINT_RES * 0.45) / (PAINT_RES * 0.5));
        const faceBoost = distCenter < 0.78 ? 0.36 : 0.0;

        if (currentStyle === 'pixel') {
          if (tIdx === 5 && (jx + jy) % 12 === 0 && edgeW + faceBoost < 0.15) continue;
          if (tIdx === 6 && edgeW + faceBoost < 0.20) continue;
          if (tIdx === 7 && edgeW + faceBoost < 0.28) continue;
        } else {
          if (tIdx === 4 && edgeW + faceBoost < 0.08 && rng() < 0.30) continue;
          if (tIdx === 5 && edgeW + faceBoost < 0.12 && rng() < 0.45) continue;
          if (tIdx === 6 && edgeW + faceBoost < 0.15 && rng() < 0.55) continue;
          if (tIdx === 7 && edgeW + faceBoost < 0.18 && rng() < 0.62) continue;
        }

        const p = flat * 4;
        const r = styleTargetPixels[p], g = styleTargetPixels[p + 1], b = styleTargetPixels[p + 2];
        const angle = edgeAngleMap[flat] + (rng() - 0.5) * (tIdx <= 1 ? 0.65 : 0.22);

        tierStrokes.push({
          x: jx,
          y: jy,
          r, g, b,
          rawLum: normLumMap[flat],
          edgeW,
          hex: rgbToHex(r, g, b),
          angle,
          tierIdx: tIdx,
          size: bSize,
          seed: rng(),
          sortKey: Math.floor(jy / (step * 3)) * 1000 + jx * ((Math.floor(jy / (step * 3)) % 2 === 0) ? 1 : -1) + (rng() - 0.5) * 45,
        });
      }
    }

    tierStrokes.sort((a, b) => a.sortKey - b.sortKey);

    const n = tierStrokes.length;
    for (let i = 0; i < n; i++) {
      const s = tierStrokes[i];
      s.progress = tier.startFrac + ((i + 1) / n) * (tier.endFrac - tier.startFrac);
      strokeQueue.push(s);
    }
  }

  restartPainting();
}

function resetBlankCanvas() {
  if (currentStyle === 'dibujo_tecnico') {
    paintCtx.fillStyle = '#0d3b66';
    paintCtx.fillRect(0, 0, PAINT_RES, PAINT_RES);
  } else if (currentStyle === 'pixel') {
    paintCtx.fillStyle = '#1b1626';
    paintCtx.fillRect(0, 0, PAINT_RES, PAINT_RES);
  } else if (currentStyle === 'ilustracion_cientifica') {
    paintCtx.fillStyle = '#f4ebd9';
    paintCtx.fillRect(0, 0, PAINT_RES, PAINT_RES);
  } else {
    paintCtx.fillStyle = '#f8f4ec';
    paintCtx.fillRect(0, 0, PAINT_RES, PAINT_RES);
  }
  renderedStrokeIdx = 0;
}

function restartPainting() {
  resetBlankCanvas();
  animStartTime = performance.now();
  currentElapsed = 0.0;
  isPaused = false;
  if (manualSeekMode) {
    manualSeekMode = false;
    requestAnimationFrame(animate);
  }
}

// Render Single Painterly Brushstroke Dab on paintCanvas across all 23 styles
function drawBrushStroke(s) {
  const { x, y, r, g, b, angle, size, tierIdx, edgeW, seed } = s;

  // Pixel Art 16-Bits uses crisp retro grid blocks
  if (currentStyle === 'pixel') {
    const blockSize = tierIdx === 0 ? 36 : tierIdx === 1 ? 24 : tierIdx === 2 ? 18 : tierIdx === 3 ? 12 : 6;
    const gx = Math.floor(x / blockSize) * blockSize;
    const gy = Math.floor(y / blockSize) * blockSize;
    paintCtx.fillStyle = `rgb(${r},${g},${b})`;
    paintCtx.fillRect(gx, gy, blockSize, blockSize);
    if (blockSize >= 12) {
      paintCtx.fillStyle = 'rgba(255,255,255,0.12)';
      paintCtx.fillRect(gx, gy, blockSize, 2);
      paintCtx.fillStyle = 'rgba(0,0,0,0.16)';
      paintCtx.fillRect(gx, gy + blockSize - 2, blockSize, 2);
    }
    return;
  }

  // Óleo Pincelado & Arte Conceptual & Surrealismo: Impasto 3D bristle ridges
  if (currentStyle === 'oleo' || currentStyle === 'concept_art' || currentStyle === 'surrealismo') {
    paintCtx.save();
    paintCtx.translate(x, y);
    paintCtx.rotate(angle);
    const rx = size * (tierIdx <= 1 ? 0.66 : 0.85);
    const ry = size * (tierIdx <= 1 ? 0.48 : 0.44);
    paintCtx.fillStyle = `rgba(${r},${g},${b}, ${tierIdx <= 1 ? 0.88 : 0.94})`;
    paintCtx.beginPath();
    paintCtx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    paintCtx.fill();

    const hiR = clampByte(r + 24), hiG = clampByte(g + 22), hiB = clampByte(b + 18);
    const shR = clampByte(r - 22), shG = clampByte(g - 20), shB = clampByte(b - 18);
    paintCtx.strokeStyle = `rgba(${hiR},${hiG},${hiB}, 0.45)`;
    paintCtx.lineWidth = Math.max(0.7, ry * 0.20);
    paintCtx.beginPath();
    paintCtx.ellipse(0, -ry * 0.20, rx * 0.84, ry * 0.50, 0, Math.PI, Math.PI * 2);
    paintCtx.stroke();

    const bristles = tierIdx <= 3 ? 3 : 2;
    for (let bi = 0; bi < bristles; bi++) {
      const by = ((bi / Math.max(1, bristles - 1)) - 0.5) * ry;
      paintCtx.strokeStyle = bi % 2 === 0 ? `rgba(${hiR},${hiG},${hiB}, 0.32)` : `rgba(${shR},${shG},${shB}, 0.30)`;
      paintCtx.beginPath();
      paintCtx.moveTo(-rx * 0.75, by);
      paintCtx.quadraticCurveTo(0, by + (seed - 0.5) * ry * 0.3, rx * 0.75, by);
      paintCtx.stroke();
    }
    paintCtx.restore();
    return;
  }

  // Base progressive dab using target style color (opaque/semi-opaque so it never turns dark/muddy!)
  paintCtx.save();
  paintCtx.translate(x, y);
  paintCtx.rotate(angle);

  if (tierIdx <= 1) {
    const rad = size * 0.62;
    const grad = paintCtx.createRadialGradient(0, 0, rad * 0.12, 0, 0, rad);
    grad.addColorStop(0.0, `rgba(${r},${g},${b}, 0.84)`);
    grad.addColorStop(0.65, `rgba(${r},${g},${b}, 0.48)`);
    grad.addColorStop(1.0, `rgba(${r},${g},${b}, 0.0)`);
    paintCtx.fillStyle = grad;
    paintCtx.beginPath();
    paintCtx.scale(1.15, 0.88);
    paintCtx.arc(0, 0, rad, 0, Math.PI * 2);
    paintCtx.fill();
  } else if (tierIdx <= 4) {
    const rx = size * 0.72;
    const ry = size * 0.42;
    const grad = paintCtx.createRadialGradient(0, 0, ry * 0.15, 0, 0, rx);
    grad.addColorStop(0.0, `rgba(${r},${g},${b}, 0.90)`);
    grad.addColorStop(0.75, `rgba(${r},${g},${b}, 0.58)`);
    grad.addColorStop(1.0, `rgba(${r},${g},${b}, 0.0)`);
    paintCtx.fillStyle = grad;
    paintCtx.beginPath();
    paintCtx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    paintCtx.fill();
  }
  paintCtx.restore();

  // In Passes 3 & 4 (12px -> 3px), progressively stamp the crisp stylized detail patch from styleTargetCanvas
  if (tierIdx >= 4) {
    const patchR = tierIdx === 4 ? 13 : (tierIdx === 5 ? 15 : (tierIdx === 6 ? 16 : 20));
    const alpha  = tierIdx === 4 ? 0.38 : (tierIdx === 5 ? 0.55 : (tierIdx === 6 ? 0.72 : 0.88));
    paintCtx.save();
    paintCtx.globalAlpha = alpha;
    paintCtx.beginPath();
    paintCtx.arc(x, y, patchR, 0, Math.PI * 2);
    paintCtx.clip();
    paintCtx.drawImage(
      styleTargetCanvas,
      x - patchR, y - patchR, patchR * 2, patchR * 2,
      x - patchR, y - patchR, patchR * 2, patchR * 2
    );
    paintCtx.restore();
  }
}

function advancePaintingToProgress(targetProgress) {
  const clampedProg = Math.max(0.0, Math.min(1.0, targetProgress));
  if (clampedProg === 0.0) {
    resetBlankCanvas();
  }

  let lastStroke = null;
  while (renderedStrokeIdx < strokeQueue.length && strokeQueue[renderedStrokeIdx].progress <= clampedProg) {
    lastStroke = strokeQueue[renderedStrokeIdx];
    drawBrushStroke(lastStroke);
    renderedStrokeIdx++;
  }

  // Final lock-in polish at 99.2%+ so fine lines, hatching, screentones, and small facial details are 100% sharp
  if (clampedProg >= 0.992 && currentStyle !== 'oleo' && currentStyle !== 'pixel') {
    paintCtx.save();
    paintCtx.globalAlpha = 0.35;
    paintCtx.drawImage(styleTargetCanvas, 0, 0);
    paintCtx.restore();
  }

  // Update active brush telemetry for studio UI cards
  let activeTierIdx = 0;
  for (let i = 0; i < BRUSH_TIERS.length; i++) {
    if (clampedProg >= BRUSH_TIERS[i].startFrac) activeTierIdx = i;
  }
  const tier = BRUSH_TIERS[activeTierIdx];
  activeBrushInfo.size = tier.size;
  activeBrushInfo.pass = tier.pass;
  activeBrushInfo.passTitle = tier.passTitle;
  activeBrushInfo.passRange = tier.passRange;
  activeBrushInfo.tierIdx = activeTierIdx;

  if (lastStroke) {
    activeBrushInfo.hex = lastStroke.hex;
    activeBrushInfo.r = lastStroke.r;
    activeBrushInfo.g = lastStroke.g;
    activeBrushInfo.b = lastStroke.b;
    activeBrushInfo.cx += (lastStroke.x - activeBrushInfo.cx) * 0.45;
    activeBrushInfo.cy += (lastStroke.y - activeBrushInfo.cy) * 0.45;
  }
}

// ============================================================================
// 3. COMPOSITE STUDIO CANVAS RENDERER (16:9 HORIZONTAL & 9:16 VERTICAL MOBILE)
// ============================================================================
function roundRectPath(ctx, x, y, w, h, r) {
  const rad = Math.min(r, w * 0.5, h * 0.5);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

function fillCard(ctx, x, y, w, h, r = 18) {
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.36)';
  ctx.shadowBlur = 18;
  ctx.shadowOffsetY = 6;
  ctx.fillStyle = '#251c16';
  roundRectPath(ctx, x, y, w, h, r);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(255, 215, 185, 0.12)';
  ctx.lineWidth = 1.5;
  roundRectPath(ctx, x, y, w, h, r);
  ctx.stroke();
}

function updateStudioDimensions() {
  const wantVert = layoutMode === 'vertical' || (layoutMode === 'auto' && window.innerHeight > window.innerWidth * 1.08);
  if (wantVert !== isVerticalStudio || (wantVert && studioCanvas.width !== 1080) || (!wantVert && studioCanvas.width !== 1600)) {
    isVerticalStudio = wantVert;
    if (isVerticalStudio) {
      studioCanvas.width = 1080;
      studioCanvas.height = 1920;
    } else {
      studioCanvas.width = 1600;
      studioCanvas.height = 900;
    }
  }
}

function renderStudioFrame(progress) {
  updateStudioDimensions();
  const W = studioCanvas.width;
  const H = studioCanvas.height;
  const ctx = studioCtx;

  // 1. Warm Terracotta / Cocoa Studio Background Gradient (Exact match to Sundar Pichai X post!)
  const bgGrad = ctx.createLinearGradient(0, 0, W, H);
  bgGrad.addColorStop(0.0, '#cfa087');
  bgGrad.addColorStop(0.5, '#c18e74');
  bgGrad.addColorStop(1.0, '#9e6f58');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  if (!isVerticalStudio) {
    // ========================================================================
    // HORIZONTAL 16:9 STUDIO LAYOUT (1600 x 900 — Identical to X Video)
    // ========================================================================
    const leftX = 44, leftW = 336;
    const centerSize = 812;
    const centerX = (W - centerSize) * 0.5;
    const centerY = (H - centerSize) * 0.5;
    const rightX = W - 44 - 336, rightW = 336;

    // --- LEFT CARD 1: REFERENCE ---
    fillCard(ctx, leftX, 44, leftW, 430, 18);
    ctx.fillStyle = '#b8a698';
    ctx.font = '700 13px Inter, Segoe UI, sans-serif';
    ctx.fillText('REFERENCE', leftX + 22, 76);

    // Status Dot
    ctx.fillStyle = '#d99b7e';
    ctx.beginPath();
    ctx.arc(leftX + leftW - 26, 71, 5.5, 0, Math.PI * 2);
    ctx.fill();

    // Reference Image Rounded Square
    const refBoxX = leftX + 20, refBoxY = 94, refBoxS = leftW - 40;
    ctx.save();
    roundRectPath(ctx, refBoxX, refBoxY, refBoxS, refBoxS, 12);
    ctx.clip();
    ctx.drawImage(refCanvas, refBoxX, refBoxY, refBoxS, refBoxS);
    ctx.restore();

    ctx.fillStyle = '#8e7d70';
    ctx.font = '500 13px Inter, Segoe UI, sans-serif';
    ctx.fillText('Uploaded Portrait • 1:1', leftX + 22, 452);

    // --- LEFT CARD 2: PASS INFO ---
    fillCard(ctx, leftX, 494, leftW, 168, 18);
    ctx.fillStyle = '#b8a698';
    ctx.font = '700 12.5px Inter, Segoe UI, sans-serif';
    ctx.fillText(`PASS ${activeBrushInfo.pass} OF 4 • ${activeBrushInfo.passRange}`, leftX + 22, 530);

    ctx.fillStyle = '#f7efe8';
    ctx.font = '700 28px Inter, Segoe UI, sans-serif';
    ctx.fillText(activeBrushInfo.passTitle, leftX + 22, 576);

    // Pass Progress Bar
    const passStart = (activeBrushInfo.pass - 1) * 0.25;
    const passProg = Math.max(0.04, Math.min(1.0, (progress - passStart) / 0.25));
    ctx.fillStyle = '#3b2d25';
    roundRectPath(ctx, leftX + 22, 614, leftW - 44, 12, 6);
    ctx.fill();
    ctx.fillStyle = '#d69b7e';
    roundRectPath(ctx, leftX + 22, 614, (leftW - 44) * passProg, 12, 6);
    ctx.fill();

    // --- LEFT CARD 3: TIMELINE ---
    fillCard(ctx, leftX, 682, leftW, 174, 18);
    ctx.fillStyle = '#b8a698';
    ctx.font = '700 12.5px Inter, Segoe UI, sans-serif';
    ctx.fillText('TIMELINE', leftX + 22, 716);

    const curSec = (progress * totalDuration).toFixed(1).padStart(4, '0');
    const totSec = totalDuration.toFixed(1).padStart(4, '0');
    ctx.fillStyle = '#f7efe8';
    ctx.font = '700 27px monospace';
    ctx.fillText(`0:${curSec}`, leftX + 22, 760);
    ctx.fillStyle = '#8e7d70';
    ctx.font = '600 18px monospace';
    ctx.fillText(`/ 0:${totSec}`, leftX + 132, 760);

    // 4 Segmented Pass Bars
    const segGap = 8;
    const segW = (leftW - 44 - segGap * 3) / 4;
    for (let s = 0; s < 4; s++) {
      const sx = leftX + 22 + s * (segW + segGap);
      ctx.fillStyle = '#3b2d25';
      roundRectPath(ctx, sx, 784, segW, 10, 5);
      ctx.fill();
      const sFill = Math.max(0, Math.min(1, (progress - s * 0.25) / 0.25));
      if (sFill > 0) {
        ctx.fillStyle = '#d69b7e';
        roundRectPath(ctx, sx, 784, segW * sFill, 10, 5);
        ctx.fill();
      }
    }
    ctx.fillStyle = '#8e7d70';
    ctx.font = '500 13px Inter, Segoe UI, sans-serif';
    ctx.fillText(`Brush ${activeBrushInfo.size}px • 30 fps`, leftX + 22, 832);

    // --- CENTER PAINTING CANVAS ---
    drawCenterPaintingBoard(ctx, centerX, centerY, centerSize, progress);

    // --- RIGHT CARD 1: COLOR SWATCH ---
    fillCard(ctx, rightX, 44, rightW, 240, 18);
    ctx.fillStyle = '#b8a698';
    ctx.font = '700 13px Inter, Segoe UI, sans-serif';
    ctx.fillText('COLOR SWATCH', rightX + 22, 76);

    // Active Color Box
    ctx.fillStyle = activeBrushInfo.hex;
    roundRectPath(ctx, rightX + 22, 94, rightW - 44, 104, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 2;
    roundRectPath(ctx, rightX + 22, 94, rightW - 44, 104, 12);
    ctx.stroke();

    // HEX Pill
    ctx.fillStyle = '#1c1410';
    roundRectPath(ctx, rightX + 22, 214, rightW - 44, 48, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,215,185,0.14)';
    ctx.stroke();
    ctx.fillStyle = '#8e7d70';
    ctx.font = '700 13px Inter, Segoe UI, sans-serif';
    ctx.fillText('HEX', rightX + 38, 243);
    ctx.fillStyle = '#f7efe8';
    ctx.font = '700 21px monospace';
    ctx.fillText(activeBrushInfo.hex, rightX + 96, 245);

    // --- RIGHT CARD 2: BRUSH SIZE (PX) ---
    fillCard(ctx, rightX, 304, rightW, 552, 18);
    ctx.fillStyle = '#b8a698';
    ctx.font = '700 13px Inter, Segoe UI, sans-serif';
    ctx.fillText('BRUSH SIZE (PX)', rightX + 22, 338);

    for (let i = 0; i < BRUSH_TIERS.length; i++) {
      const bt = BRUSH_TIERS[i];
      const ry = 356 + i * 60;
      const isAct = (i === activeBrushInfo.tierIdx);

      ctx.fillStyle = isAct ? '#d89b7e' : '#1e1611';
      roundRectPath(ctx, rightX + 20, ry, rightW - 40, 50, 11);
      ctx.fill();
      if (!isAct) {
        ctx.strokeStyle = 'rgba(255,215,185,0.12)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Proportional Brush Dot Icon
      const dotR = Math.max(2.2, Math.min(13.5, Math.sqrt(bt.size) * 1.15));
      ctx.fillStyle = isAct ? '#1f1510' : '#f5ece4';
      ctx.beginPath();
      ctx.arc(rightX + 48, ry + 25, dotR, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = isAct ? '#1f1510' : '#f5ece4';
      ctx.font = '700 16px monospace';
      ctx.fillText(`${bt.size} px`, rightX + 78, ry + 30);

      if (isAct) {
        ctx.fillStyle = '#2d1e17';
        ctx.font = '800 12px Inter, Segoe UI, sans-serif';
        ctx.fillText('ACTIVE', rightX + rightW - 84, ry + 30);
      }
    }
  } else {
    // ========================================================================
    // VERTICAL 9:16 MOBILE STUDIO LAYOUT (1080 x 1920 — Tailored for Phones!)
    // ========================================================================
    const pad = 32;
    const topY = 32;
    const cardH = 310;
    const leftCardW = 320;
    const rightCardW = W - pad * 2 - leftCardW - 20;

    // Top-Left: REFERENCE Card
    fillCard(ctx, pad, topY, leftCardW, cardH, 20);
    ctx.fillStyle = '#b8a698';
    ctx.font = '700 14px Inter, Segoe UI, sans-serif';
    ctx.fillText('REFERENCE', pad + 20, topY + 34);
    ctx.fillStyle = '#d99b7e';
    ctx.beginPath();
    ctx.arc(pad + leftCardW - 24, topY + 29, 6, 0, Math.PI * 2);
    ctx.fill();

    const refS = 216;
    ctx.save();
    roundRectPath(ctx, pad + 20, topY + 48, refS, refS, 14);
    ctx.clip();
    ctx.drawImage(refCanvas, pad + 20, topY + 48, refS, refS);
    ctx.restore();
    ctx.fillStyle = '#8e7d70';
    ctx.font = '600 13px Inter, Segoe UI, sans-serif';
    ctx.fillText('Uploaded Portrait • 1:1', pad + 20, topY + 290);

    // Top-Right: PASS + COLOR SWATCH + TIMELINE Combined Card
    const rx = pad + leftCardW + 20;
    fillCard(ctx, rx, topY, rightCardW, cardH, 20);
    ctx.fillStyle = '#b8a698';
    ctx.font = '700 14px Inter, Segoe UI, sans-serif';
    ctx.fillText(`PASS ${activeBrushInfo.pass} OF 4 • ${activeBrushInfo.passRange}`, rx + 24, topY + 36);

    ctx.fillStyle = '#f7efe8';
    ctx.font = '800 34px Inter, Segoe UI, sans-serif';
    ctx.fillText(activeBrushInfo.passTitle, rx + 24, topY + 84);

    const curSec = (progress * totalDuration).toFixed(1).padStart(4, '0');
    const totSec = totalDuration.toFixed(1).padStart(4, '0');
    ctx.fillStyle = '#d89b7e';
    ctx.font = '700 26px monospace';
    ctx.fillText(`0:${curSec} / 0:${totSec}`, rx + 24, topY + 130);

    // Color Swatch on Right Half of Top-Right Card
    const swX = rx + rightCardW - 250, swY = topY + 24, swW = 226, swH = 126;
    ctx.fillStyle = activeBrushInfo.hex;
    roundRectPath(ctx, swX, swY, swW, swH, 14);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#1b130e';
    roundRectPath(ctx, swX, swY + swH + 12, swW, 50, 10);
    ctx.fill();
    ctx.fillStyle = '#8e7d70';
    ctx.font = '700 14px sans-serif';
    ctx.fillText('HEX', swX + 18, swY + swH + 43);
    ctx.fillStyle = '#fff';
    ctx.font = '700 22px monospace';
    ctx.fillText(activeBrushInfo.hex, swX + 72, swY + swH + 44);

    // 4 Segmented Pass Progress Bars at Bottom of Top-Right Card
    const segGap = 10;
    const segW = (rightCardW - 48 - segGap * 3) / 4;
    for (let s = 0; s < 4; s++) {
      const sx = rx + 24 + s * (segW + segGap);
      ctx.fillStyle = '#3b2d25';
      roundRectPath(ctx, sx, topY + 246, segW, 14, 7);
      ctx.fill();
      const sFill = Math.max(0, Math.min(1, (progress - s * 0.25) / 0.25));
      if (sFill > 0) {
        ctx.fillStyle = '#d69b7e';
        roundRectPath(ctx, sx, topY + 246, segW * sFill, 14, 7);
        ctx.fill();
      }
    }
    ctx.fillStyle = '#8e7d70';
    ctx.font = '600 14px Inter, Segoe UI, sans-serif';
    ctx.fillText(`Brush ${activeBrushInfo.size}px • 30 fps`, rx + 24, topY + 288);

    // Center Square Painting Canvas (1016 x 1016)
    const boardSize = W - pad * 2;
    const boardY = topY + cardH + 26;
    drawCenterPaintingBoard(ctx, pad, boardY, boardSize, progress);

    // Bottom Card: 8 BRUSH SIZES (2x4 Grid)
    const botY = boardY + boardSize + 26;
    const botH = H - botY - 32;
    fillCard(ctx, pad, botY, boardSize, botH, 20);
    ctx.fillStyle = '#b8a698';
    ctx.font = '700 15px Inter, Segoe UI, sans-serif';
    ctx.fillText('BRUSH SIZE (PX)', pad + 24, botY + 36);

    const colW = (boardSize - 64) / 2;
    for (let i = 0; i < BRUSH_TIERS.length; i++) {
      const bt = BRUSH_TIERS[i];
      const col = Math.floor(i / 4);
      const row = i % 4;
      const bx = pad + 24 + col * (colW + 16);
      const by = botY + 56 + row * 94;
      const isAct = (i === activeBrushInfo.tierIdx);

      ctx.fillStyle = isAct ? '#d89b7e' : '#1e1611';
      roundRectPath(ctx, bx, by, colW, 76, 14);
      ctx.fill();

      const dotR = Math.max(3.5, Math.min(16, Math.sqrt(bt.size) * 1.35));
      ctx.fillStyle = isAct ? '#1f1510' : '#f5ece4';
      ctx.beginPath();
      ctx.arc(bx + 38, by + 38, dotR, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = isAct ? '#1f1510' : '#f5ece4';
      ctx.font = '700 22px monospace';
      ctx.fillText(`${bt.size} px`, bx + 74, by + 46);

      if (isAct) {
        ctx.fillStyle = '#2d1e17';
        ctx.font = '800 15px Inter, Segoe UI, sans-serif';
        ctx.fillText('ACTIVE', bx + colW - 88, by + 44);
      }
    }
  }
}

function drawCenterPaintingBoard(ctx, x, y, size, progress) {
  ctx.save();
  ctx.shadowColor = 'rgba(0, 0, 0, 0.42)';
  ctx.shadowBlur = 24;
  ctx.shadowOffsetY = 8;
  ctx.fillStyle = '#f6f2eb';
  roundRectPath(ctx, x, y, size, size, 8);
  ctx.fill();
  ctx.restore();

  ctx.save();
  roundRectPath(ctx, x, y, size, size, 8);
  ctx.clip();
  ctx.drawImage(paintCanvas, 0, 0, PAINT_RES, PAINT_RES, x, y, size, size);

  // Draw Animated Circular Brush Cursor Ring (like in the Sundar Pichai screenshots!)
  if (progress < 0.996) {
    const scale = size / PAINT_RES;
    const cx = x + activeBrushInfo.cx * scale;
    const cy = y + activeBrushInfo.cy * scale;
    const ringR = Math.max(7, activeBrushInfo.size * 0.55 * scale);

    ctx.strokeStyle = 'rgba(45, 36, 30, 0.78)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    ctx.arc(cx, cy, ringR + 1.4, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = 'rgba(45, 36, 30, 0.85)';
    ctx.beginPath();
    ctx.arc(cx, cy, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.strokeStyle = '#3a2b22';
  ctx.lineWidth = 2.5;
  roundRectPath(ctx, x, y, size, size, 8);
  ctx.stroke();
}

// ============================================================================
// 4. VIDEO RECORDING FROM ZERO (MOBILE & PC) + WHATSAPP SHARE
// ============================================================================
let mediaRecorder = null;
let recordedChunks = [];
let isRecordingProcess = false;
let lastRecordedBlob = null;
let lastRecordedExt = 'webm';

function getSupportedMimeType() {
  const types = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
  ];
  for (const t of types) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  }
  return '';
}

function startRecordingFromZero() {
  if (isRecordingProcess) {
    stopRecordingProcess();
    return;
  }
  if (!window.MediaRecorder || !studioCanvas.captureStream) {
    showToast('⚠️ Tu navegador no soporta grabación directa de lienzo.');
    return;
  }

  // Restart painting from 0:00.0
  restartPainting();
  renderStudioFrame(0.0);

  const mimeType = getSupportedMimeType();
  lastRecordedExt = mimeType.includes('mp4') ? 'mp4' : 'webm';
  const stream = studioCanvas.captureStream(30);
  recordedChunks = [];

  try {
    mediaRecorder = mimeType
      ? new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 8000000 })
      : new MediaRecorder(stream);
  } catch (e) {
    mediaRecorder = new MediaRecorder(stream);
  }

  mediaRecorder.ondataavailable = (ev) => {
    if (ev.data && ev.data.size > 0) recordedChunks.push(ev.data);
  };

  mediaRecorder.onstop = () => {
    isRecordingProcess = false;
    document.body.classList.remove('is-recording');
    const btnRec = document.getElementById('btn-record');
    if (btnRec) {
      btnRec.classList.remove('recording');
      btnRec.textContent = '🔴 Grabar Proceso (Video)';
    }

    if (recordedChunks.length === 0) return;
    lastRecordedBlob = new Blob(recordedChunks, { type: mimeType || 'video/webm' });
    const url = URL.createObjectURL(lastRecordedBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `pintura_${currentStyle}_${Date.now()}.${lastRecordedExt}`;
    document.body.appendChild(a);
    a.click();
    a.remove();

    const btnShare = document.getElementById('btn-share');
    if (btnShare && navigator.canShare) {
      btnShare.style.display = 'inline-flex';
    }
    showToast('✅ ¡Video del proceso grabado y descargado! Listo para enviar 📲', 4200);
  };

  isRecordingProcess = true;
  document.body.classList.add('is-recording');
  mediaRecorder.start(200);

  const btnRec = document.getElementById('btn-record');
  if (btnRec) {
    btnRec.classList.add('recording');
    btnRec.textContent = '⏹️ Grabando... (Pulsa para detener)';
  }
  showToast('🔴 Grabando proceso limpio desde 0:00.0... Se descargará al llegar al 100 %', 3500);
}

function stopRecordingProcess() {
  document.body.classList.remove('is-recording');
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecordingProcess = false;
}

async function shareRecordedVideo() {
  if (!lastRecordedBlob) return;
  const file = new File([lastRecordedBlob], `pintura_digital.${lastRecordedExt}`, { type: lastRecordedBlob.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        title: 'Pintura Digital Progresiva',
        text: 'Mira cómo se pintó esta foto paso a paso 🎨',
        files: [file],
      });
    } catch (err) {
      // User cancelled share sheet
    }
  } else {
    showToast('El video ya se descargó en tu dispositivo 📥');
  }
}

const STYLE_MAP = {};
STYLE_CATEGORIES.forEach(cat => cat.items.forEach(it => { STYLE_MAP[it.id] = it; }));
// Alias de compatibilidad
STYLE_MAP['lapiz'] = STYLE_MAP['carboncillo'];
STYLE_MAP['realista'] = STYLE_MAP['hiperrealismo'];

const modalBackdrop = document.getElementById('style-modal-backdrop');
const categoriesContainer = document.getElementById('style-categories-container');
const currentStyleLabel = document.getElementById('current-style-label');

function buildStyleModalDOM() {
  if (!categoriesContainer) return;
  categoriesContainer.innerHTML = '';
  STYLE_CATEGORIES.forEach((cat) => {
    const block = document.createElement('div');
    block.className = 'cat-block';

    const title = document.createElement('div');
    title.className = 'cat-title';
    title.textContent = cat.category;
    block.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'style-grid';

    cat.items.forEach((item) => {
      const btn = document.createElement('button');
      btn.className = 'style-card-btn' + (item.id === currentStyle ? ' active' : '');
      btn.setAttribute('data-style', item.id);
      btn.innerHTML = `
        <div class="st-name"><span>${item.icon}</span> <span>${item.name}</span></div>
        <div class="st-desc">${item.desc}</div>
      `;
      btn.addEventListener('click', () => {
        selectArtStyle(item.id);
        modalBackdrop?.classList.remove('open');
      });
      grid.appendChild(btn);
    });

    block.appendChild(grid);
    categoriesContainer.appendChild(block);
  });
}

function selectArtStyle(styleId) {
  if (styleId === 'lapiz') styleId = 'carboncillo';
  if (styleId === 'realista') styleId = 'hiperrealismo';
  if (!STYLE_MAP[styleId]) return;
  currentStyle = styleId;
  const info = STYLE_MAP[styleId];
  if (currentStyleLabel) currentStyleLabel.textContent = info.name;
  document.querySelectorAll('.style-card-btn').forEach((b) => {
    b.classList.toggle('active', b.getAttribute('data-style') === currentStyle);
  });
  if (isRecordingProcess) stopRecordingProcess();
  analyzeAndPlanImage(currentLoadedImage);
  showToast(`${info.icon} ${info.name} • Pintando de 126px a 3px...`);
}

document.getElementById('btn-open-styles')?.addEventListener('click', () => {
  modalBackdrop?.classList.add('open');
});
document.getElementById('btn-close-styles')?.addEventListener('click', () => {
  modalBackdrop?.classList.remove('open');
});
modalBackdrop?.addEventListener('click', (e) => {
  if (e.target === modalBackdrop) modalBackdrop.classList.remove('open');
});

buildStyleModalDOM();

const fileInput = document.getElementById('file-input');
document.getElementById('btn-upload')?.addEventListener('click', () => fileInput?.click());

fileInput?.addEventListener('change', (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      if (isRecordingProcess) stopRecordingProcess();
      analyzeAndPlanImage(img);
      const info = STYLE_MAP[currentStyle] || { name: currentStyle };
      showToast(`📸 ¡Foto cargada en modo ${info.name}!`);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer?.files?.[0];
  if (file && file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        if (isRecordingProcess) stopRecordingProcess();
        analyzeAndPlanImage(img);
        const info = STYLE_MAP[currentStyle] || { name: currentStyle };
        showToast(`📸 ¡Foto cargada en modo ${info.name}!`);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }
});

document.getElementById('btn-record')?.addEventListener('click', startRecordingFromZero);
document.getElementById('btn-share')?.addEventListener('click', shareRecordedVideo);
document.getElementById('btn-replay')?.addEventListener('click', () => {
  if (isRecordingProcess) stopRecordingProcess();
  restartPainting();
  showToast('🔄 Repitiendo proceso de pintado desde cero');
});

document.getElementById('btn-save-img')?.addEventListener('click', () => {
  const url = studioCanvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = `estudio_pintura_${currentStyle}_${Date.now()}.png`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  showToast('🖼️ ¡Imagen HD guardada!');
});

document.getElementById('sel-layout')?.addEventListener('change', (e) => {
  layoutMode = e.target.value;
  renderStudioFrame(Math.min(1.0, currentElapsed / totalDuration));
});

document.getElementById('sel-duration')?.addEventListener('change', (e) => {
  totalDuration = parseFloat(e.target.value) || 20.0;
  restartPainting();
  showToast(`⏱️ Duración ajustada a ${totalDuration} segundos`);
});

window.renderAt = function(tSeconds) {
  manualSeekMode = true;
  resetBlankCanvas();
  currentElapsed = Math.max(0, Math.min(totalDuration, tSeconds));
  const prog = currentElapsed / totalDuration;
  advancePaintingToProgress(prog);
  renderStudioFrame(prog);
};

function animate(now) {
  if (!manualSeekMode && strokeQueue.length > 0) {
    currentElapsed = (now - animStartTime) / 1000.0;
    const prog = Math.min(1.0, currentElapsed / totalDuration);
    advancePaintingToProgress(prog);
    renderStudioFrame(prog);

    if (isRecordingProcess && currentElapsed >= totalDuration + 0.65) {
      stopRecordingProcess();
    }
  }
  if (!manualSeekMode) {
    requestAnimationFrame(animate);
  }
}

const initParams = new URLSearchParams(window.location.search);
if (initParams.get('layout')) {
  layoutMode = initParams.get('layout');
}
if (initParams.get('style')) {
  let st = initParams.get('style');
  if (st === 'lapiz') st = 'carboncillo';
  if (st === 'realista') st = 'hiperrealismo';
  if (STYLE_MAP[st]) {
    currentStyle = st;
    if (currentStyleLabel) currentStyleLabel.textContent = STYLE_MAP[st].name;
    buildStyleModalDOM();
  }
}
if (initParams.get('openModal') === '1') {
  modalBackdrop?.classList.add('open');
}
if (initParams.has('t')) {
  manualSeekMode = true;
}

const demoImg = new Image();
demoImg.onload = () => {
  analyzeAndPlanImage(demoImg);
  window.__PAINTER_READY__ = true;
  if (initParams.has('t')) {
    window.renderAt(parseFloat(initParams.get('t')));
  } else {
    requestAnimationFrame(animate);
  }
};
demoImg.src = DEFAULT_PORTRAIT_B64;
